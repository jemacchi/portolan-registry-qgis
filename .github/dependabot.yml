# Thin config — synced from portolan-sdi/portolan-ops (ci/python-package/).
# Ships with the family caller: the github-actions ecosystem is what
# turns an ops v2 release into a PR here instead of a silent break.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    # Fresh releases are where supply-chain compromises surface. The
    # delay lets advisories and yanks land first (zizmor
    # dependabot-cooldown).
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, python]
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
